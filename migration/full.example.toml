# Paths resolve from the repository root, regardless of the working directory.
[source]
site_url = "https://zderadicka.eu"
wxr = "migration/source/ivanovo.WordPress.2026-10-28.xml"
uploads = "migration/source/backup/wp-content/uploads"
baseline = "migration/source/snapshot/zderadicka.eu"

[output]
site = "migration/work/full-site"
records = "migration/work/normalized"
reports = "migration/reports/full"

[policy]
published_only = true
preserve_upload_paths = true
comments = "omit"
gists = "embed"

[selection]
scope = "all"

# Verified from snapshot/thethe-slider/thetool/index.html, .entry-attachment.
[attachment_aliases]
"/thethe-slider/thetool/" = "/wp-content/uploads/thetool.png"
