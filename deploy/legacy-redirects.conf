map $args $wp_has_query {
    default 0;
    ~(^|&)(p|page_id)= 1;
}
map $args $wp_without_p {
    default $args;
    ~^p=[^&]*&?(?<p_tail>.*)$ $p_tail;
    ~^(?<p_before>.+)&p=[^&]*&(?<p_after>.*)$ "$p_before&$p_after";
    ~^(?<p_prefix>.+)&p=[^&]*$ $p_prefix;
}
map $wp_without_p $wp_remaining_args {
    default $wp_without_p;
    ~^page_id=[^&]*&?(?<page_id_tail>.*)$ $page_id_tail;
    ~^(?<page_id_before>.+)&page_id=[^&]*&(?<page_id_after>.*)$ "$page_id_before&$page_id_after";
    ~^(?<page_id_prefix>.+)&page_id=[^&]*$ $page_id_prefix;
}
map $wp_remaining_args $wp_query {
    default "?$wp_remaining_args";
    "" "";
}
