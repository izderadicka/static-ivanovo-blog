worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml application/rss+xml image/svg+xml;

    include /etc/nginx/legacy-redirects.conf;

    server {
        listen 8080;
        server_name _;
        root /site;
        index index.html;
        autoindex off;
        absolute_redirect off;
        error_page 404 /404.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;

        location = / {
            if ($wp_legacy_path != "") {
                return 308 $wp_legacy_path$wp_query;
            }
            if ($wp_has_query) {
                return 404;
            }
            if ($arg_s != "") {
                return 302 /search/?q=$arg_s;
            }
            try_files /index.html =404;
        }

        location ~ ^/(?:feed/?|rss\.xml)$ {
            types {
            }
            default_type application/rss+xml;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Robots-Tag "noindex" always;
            try_files $uri $uri/index.html =404;
        }

        location ~ ^(.*/feed/)rss2/?$ {
            return 308 $1;
        }

        # Historical term spellings now handled by Zola's native taxonomies.
        location = /category/security-2/ { return 308 /category/security/; }
        location = /category/web-design-2/ { return 308 /category/web-design/; }
        location = /tag/plsql/ { return 308 /tag/pl-sql/; }
        location = /tag/asynchronous-io/ { return 308 /tag/asynchronous-i-o/; }

        # Retired WordPress archives lead to the single year archive.
        location ~ ^/author/ {
            return 308 /archives/;
        }

        location ~ "^/([0-9]{4})(?:/|$)" {
            return 308 /archives/#$1;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
